defaults:
  - pretrain: contrastive
  - downstream: default
  - _self_
  - override /hydra/sweeper: list


run_name: "Contrastive SAMPLE WISE (full augment) (EfficientNet) Shifted windows experiment (BiHeartS) (Downstream)"

# GLOBAL PARAMS
seed: 42
segment_length: 240
channels: 1
sampling_rate: 4
device: "mps"

# TODO: implement shift in downstream tasks as well

# PRETRAIN PARAMS
pretrain:
  dataset:
    base_path: "../datasets_cleaning/data_ready_nolabel.nosync"
    sample_scaling_method: null
      # _target_: edamame.utils.sample_scaling.mean_scaling
      # _partial_: true
    shift: 1
    segment_length: ${segment_length}
    dataset_names:
    - BiHeartS
  trainer:
    fast_dev_run: false
    devices: auto
  model:
    loss_fn:
      ignore_keys: true

# DOWNSTREAM PARAMS
downstream:
  datasets: 
    - name: BiHeartS
      label_name: sleep_wake
      side: left
    - name: USILaughs
      label_name: cognitiveload
      side: right
  datamodule:
    path_to_data: "../pretrained_foundation_models_physiological_data/data.nosync"
    recompute_features: true
    debug: false # !!!!!!!!!!!! SET TO FALSE FOR PRODUCTION !!!!!!!!!!!!


hydra:
  mode: RUN
  sweep:
    dir: "outputs.nosync/${run_name}/multirun_${now:%Y-%m-%d}-${now:%H-%M-%S}"
    subdir: "${seed}"
  sweeper:
    grid_params: 
      seed: 42
      pretrain.engine.optimizer_kwargs.lr: 0.001
    list_params:
      pretrain.model.mbconv_channels:
      - 32
      - 32
      pretrain.model.embedding_dim:
      - 32
      - 64
      pretrain.model.num_mbconv_blocks:
      - 8
      - 16
# play later with batch size
