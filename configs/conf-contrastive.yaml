defaults:
  - pretrain: contrastive
  - downstream: default
  - _self_
  - override /hydra/sweeper: list


experiment_name: "Contrastive (EfficientNet) Shifted windows experiment (BiHeartS) (Downstream)"

# GLOBAL PARAMS
seed: 42
segment_length: 240
channels: 1
sampling_rate: 4
device: "cuda"

# TODO: implement shift in downstream tasks as well

# PRETRAIN PARAMS
pretrain:
  dataset:
    base_path: "data_online.nosync" 
    sample_scaling_method: null
      # _target_: edamame.utils.sample_scaling.mean_scaling
      # _partial_: true
    shift: 1
    segment_length: ${segment_length}
    dataset_names:
    - BiHeartS
  trainer:
    fast_dev_run: 10
    devices: [1]

# DOWNSTREAM PARAMS
downstream:
  datasets: 
    - name: BiHeartS
      label_name: sleep_wake
      side: left
    - name: USILaughs
      label_name: cognitiveload
      side: right
  datamodule:
    path_to_data: "../pretrained_foundation_models_physiological_data/data.nosync"
    recompute_features: true
    debug: false # !!!!!!!!!!!! SET TO FALSE FOR PRODUCTION !!!!!!!!!!!!


hydra:
  mode: RUN
  sweep:
    dir: "outputs.nosync/${experiment_name}/multirun_${pretrain.now:%Y-%m-%d}-${pretrain.now:%H-%M-%S}"
    subdir: "${seed}"
  sweeper:
    grid_params: 
      seed: 42
      engine.optimizer_kwargs.lr: 0.0005
    list_params:
      model.mbconv_channels:
      - 16
      - 32
      model.embedding_dim:
      - 32
      - 64
      model.num_mbconv_blocks:
      - 4
      - 8
# play later with batch size
