defaults:
  - pretrain: reconstruction
  - downstream: default
  - _self_
  - override /hydra/sweeper: list

# GLOBAL PARAMS
seed: 42
segment_length: 240
channels: 1
sampling_rate: 4
device: "mps"

# TODO: implement shift in downstream tasks as well

# PRETRAIN PARAMS
pretrain:
  dataset:
    base_path: "/Users/leonardoalchieri/Desktop/GIT-Mine/datasets_cleaning/data_ready_nolabel.nosync" 
    sample_scaling_method: null
      # _target_: edamame.utils.sample_scaling.mean_scaling
      # _partial_: true
    shift: 1
    dataset_names:
    - BiHeartS
  trainer:
    fast_dev_run: 10

# DOWNSTREAM PARAMS
downstream:
  datasets: 
    - name: BiHeartS
      label_name: sleep_wake
      side: left
    - name: USILaughs
      label_name: cognitiveload
      side: right
  datamodule:
    path_to_data: "/Users/leonardoalchieri/Desktop/GIT-Mine/pretrained_foundation_models_physiological_data/data.nosync"
    recompute_features: true
    debug: false # !!!!!!!!!!!! SET TO FALSE FOR PRODUCTION !!!!!!!!!!!!


# SWEEP
hydra:
  mode: RUN
  sweep:
    dir: "outputs.nosync/${experiment_name}/multirun_${now:%Y-%m-%d}-${now:%H-%M-%S}"
    subdir: "${model.loss_fn.masked_weight}-${seed}"
  sweeper:
    list_params:
      pretrain.model.mask_ratio: 0.0, 0.1, 0.1
      pretrain.model.loss_fn.masked_weight: 0.0, 0.5, 0.7
