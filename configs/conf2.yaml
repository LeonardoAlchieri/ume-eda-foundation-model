defaults:
  - pretrain: reconstruction
  - downstream: default
  - _self_
  - override /hydra/sweeper: list


run_name: "Experiment with channel 0!"

# GLOBAL PARAMS
seed: 42
segment_length: 240
channels: 0
sampling_rate: 4
device: "mps"

sample_scaling_method:
  _target_: edamame.utils.sample_scaling.min_max_scaling_per_user
  _partial_: true

# TODO: implement shift in downstream tasks as well

# PRETRAIN PARAMS
pretrain:
  dataset:
    base_path: "../data_ready_nolabel.nosync" 
      # _target_: edamame.utils.sample_scaling.mean_scaling
      # _partial_: true
    shift: 1
    dataset_names:
    - BiHeartS
    sample_scaling_method: ${sample_scaling_method}
  trainer:
    # fast_dev_run: 10
    devices: auto

# DOWNSTREAM PARAMS
downstream:
  datasets: 
    - name: BiHeartS
      label_name: sleep_wake
      side: left
    - name: USILaughs
      label_name: cognitiveload
      side: right
  datamodule:
    path_to_data: "../data.nosync"
    recompute_features: true
    debug: false # !!!!!!!!!!!! SET TO FALSE FOR PRODUCTION !!!!!!!!!!!!
  sample_scaling_method: ${sample_scaling_method}


# SWEEP
hydra:
  mode: MULTIRUN
  sweep:
    dir: "outputs.nosync/${run_name}/multirun_${now:%Y-%m-%d}-${now:%H-%M-%S}"
    # subdir: "${pretrain.model.loss_fn.masked_weight}-${seed}"
  sweeper:
    list_params:
      pretrain.model.mask_ratio: 0, 0.1, 0.1, 0.4, 0.4
      pretrain.model.loss_fn.masked_weight: 0, 0.1, 0.5, 0.1, 0.5
