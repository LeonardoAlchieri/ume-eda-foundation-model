defaults:
  - _self_
  - model: logistic_regression
  - validation_method: lopo
  - resampling: none
  - aggregator: none # accepted: mean_chan, mean_time or none
  - feature_scaling_method: standard_scaler
  - sample_scaling_method: none
  - label_processor: label_binarizer
  - trainable_feature_extractor: none

# Downstream evaluation runs after pretraining and needs the optional
# `edamame_downstream` package. It is skipped with a warning if that package is
# not installed; set `downstream.enabled=false` to skip it explicitly.
enabled: true

sampling_rate: ${sampling_rate}
device: ${accelerator}
batch_size: ${pretrain.dataloader.batch_size}

datamodule:
  _target_: edamame_downstream.data.EDADataset
  path_to_data: null
  validation_method: ${downstream.validation_method}
  feature_extractor: null
  name: null
  label_processor: ${downstream.label_processor}
  feature_scaling_method: ${downstream.feature_scaling_method}
  channels: ${channels} # 0 mixed, 1 phasic, 2 tonic
  sample_scaling_method: ${downstream.sample_scaling_method}
  recompute_features: true
  debug: false # !!!!!!!!!!!! SET TO FALSE FOR PRODUCTION !!!!!!!!!!!!

engine:
  _target_: edamame_downstream.engine.Engine
  model: ${downstream.model}
  scoring: 
    _target_: sklearn.metrics.balanced_accuracy_score
    _partial_: true
  inner_cv_folds: 3
  resampling: ${downstream.resampling}
  trainable_feature_extractor: ${downstream.trainable_feature_extractor}
  n_jobs: 2
  additional_metrics:
    - _target_: sklearn.metrics.accuracy_score
      _partial_: true
    - _target_: sklearn.metrics.balanced_accuracy_score
      _partial_: true
    - _target_: sklearn.metrics.matthews_corrcoef
      _partial_: true
    - _target_: sklearn.metrics.f1_score
      _partial_: true
      average: macro
    - _target_: sklearn.metrics.precision_score
      _partial_: true
      average: macro
    - _target_: sklearn.metrics.recall_score
      _partial_: true
      average: macro
    - _target_: sklearn.metrics.roc_auc_score
      _partial_: true
      average: macro
