# Main configuration file for training self-supervised EDA models

defaults:
  - model: encoder_decoder
  - engine: reconstruction
  - dataset: eda_default
  - dataloader: default
  - logger: wandb
  - callbacks: default
  - _self_

# Experiment settings
run_name: eda_ssl_training
seed: 42

# Save configuration
save_final_checkpoint: true

# Trainer configuration
trainer:
  max_epochs: 100
  accelerator: auto  # auto, cpu, gpu, tpu
  devices: auto  # auto, or specific device numbers like [0] or [0,1]
  log_every_n_steps: 50
  deterministic: false
  gradient_clip_val: 0.0
  accumulate_grad_batches: 1
  precision: "32"  # 32, 16, or bf16
  fast_dev_run: false
  check_val_every_n_epoch: 1

