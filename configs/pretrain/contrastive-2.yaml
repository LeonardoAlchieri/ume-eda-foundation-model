# Example: Reconstruction Learning with TensorBoard
# Run with: python train.py --config-name=example_reconstruction

defaults:
  - model: efficientnet_contrastive
  - engine: contrastive
  - dataset: eda_default
  - dataloader: default
  - logger: wandb
  - callbacks: default
  - _self_

# Save configuration
save_final_checkpoint: true

# Trainer configuration
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 400
  accelerator: ${accelerator}
  devices: ${device_num}
  log_every_n_steps: 10
  deterministic: false
  # gradient_clip_val: 1.0
  accumulate_grad_batches: 1 # DEFAULT 1
  precision: "32"
  logger: ${pretrain.logger}
  check_val_every_n_epoch: 1
  callbacks: ${pretrain.callbacks}
  limit_train_batches: 5000

# Override dataloader settings
dataloader:
  batch_size: 256
  num_workers: 1
  pin_memory: true
  drop_last: true
  persistent_workers: true

# Override engine settings (data augmentation and optimizer)
engine:
  data_augmentation:
    _target_: torchvision.transforms.RandomChoice
    transforms:
      # Gaussian Noise
      - _target_: edamame.data_augmentation.matton_augment.GaussianNoiseStochastic
        sigma_scale_min: 0.0
        sigma_scale_max: 0.5
      # Identity (no augmentation)
      - _target_: edamame.data_augmentation.matton_augment.Identity
      # Low Pass Filter
      - _target_: edamame.data_augmentation.matton_augment.LowPassFilterStochastic
        data_freq: 4
        highcut_hz_min: 0.01
        highcut_hz_max: 1
        n_steps: 1000
      # High Pass Filter
      - _target_: edamame.data_augmentation.matton_augment.HighPassFilterStochastic
        data_freq: 4
        lowcut_hz_min: 0.01
        lowcut_hz_max: 1
        n_steps: 1000
      # High Frequency Noise
      - _target_: edamame.data_augmentation.matton_augment.HighFrequencyNoiseStochastic
        sigma_scale_min: 0.0
        sigma_scale_max: 1.0
        freq_bin_start_idx: 60
        freq_bin_stop_idx: 120
      # Bandstop Filter
      - _target_: edamame.data_augmentation.matton_augment.BandstopFilterStochastic
        data_freq: 4
        remove_freq_min: 0.01
        remove_freq_max: 1.0
        Q: 0.707
      # Bandpass Filter
      - _target_: edamame.data_augmentation.matton_augment.BandpassFilterStochastic
        data_freq: 4
        keep_freq_min: 0.01
        keep_freq_max: 1
        Q: 0.707
      # Temporal Cutout
      - _target_: edamame.data_augmentation.matton_augment.TemporalCutoutStochastic
        cutout_size_min: 20
        cutout_size_max: 100
      # Permute
      - _target_: edamame.data_augmentation.matton_augment.PermuteStochastic
        n_splits_max: 10
      # Flip
      - _target_: edamame.data_augmentation.matton_augment.Flip
      # Time Warping
      - _target_: edamame.data_augmentation.matton_augment.TimeWarpingStochastic
        sigma_min: 0.01
        sigma_max: 0.1
        knot_min: 1
        knot_max: 4
      # Amplitude Warping
      - _target_: edamame.data_augmentation.matton_augment.AmplitudeWarpingStochastic
        sigma_min: 0.01
        sigma_max: 0.05
        knot_min: 0
        knot_max: 4
      # Loose Sensor Artifact
      - _target_: edamame.data_augmentation.matton_augment.LooseSensorArtifactStochastic
        width_min: 4
        width_max: 120
        smooth_width_min: 2
        smooth_width_max: 20
      # Jump Artifact
      - _target_: edamame.data_augmentation.matton_augment.JumpArtifactStochastic
        max_n_jumps: 2
        shift_factor_min: 0.01
        shift_factor_max: 0.2
        smooth_width_min: 2
        smooth_width_max: 12
      # Constant Amplitude Scaling
      - _target_: edamame.data_augmentation.matton_augment.ConstantAmplitudeScalingStochastic
        scale_min: 0.5
        scale_max: 1.5
      # Tonic Constant Amplitude Scaling
      # - _target_: edamame.data_augmentation.matton_augment.TonicConstantAmplitudeScalingStochastic
      #   tonic_scale_factor_min: 0.5
      #   tonic_scale_factor_max: 1.5
      #   data_freq: 4
      # # Tonic Amplitude Warping
      # - _target_: edamame.data_augmentation.matton_augment.TonicAmplitudeWarpingStochastic
      #   sigma_min: 0.01
      #   sigma_max: 0.25
      #   knot_min: 0
      #   knot_max: 4
      #   data_freq: 4
    
dataset_scaling_fun:
  _target_: edamame.utils.dataset_scaling.get_empty_scaling_params
  _partial_: true