# Contrastive learning engine configuration

_target_: edamame.engine.ContrastiveEngine

model: ${pretrain.model}
seed: ${seed}

# Optimizer configuration
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
optimizer_kwargs:
  lr: 0.0005
  weight_decay: 0.001
  # betas: [0.9, 0.999]
  # eps: 1e-08

# scheduler:
#   _target_: torch.optim.lr_scheduler.CosineAnnealingLR
#   _partial_: true
# scheduler_kwargs:
#   T_max: 100
#   eta_min: 0.00001
scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
scheduler_kwargs:
  monitor: "val_loss"
  mode: "min"
  factor: 0.5
  patience: 10
  min_lr: 1e-6



# Metrics
metrics: null


