# Reconstruction engine configuration (for encoder-decoder models)

_target_: ume.engine.ReconstructionEngine

model: ${pretrain.model}
seed: ${seed}

# Optimizer configuration
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.001

# Metrics for reconstruction quality evaluation
metrics:
  mae:
    _target_: torchmetrics.MeanAbsoluteError
  mse:
    _target_: torchmetrics.MeanSquaredError
    squared: false  # This gives RMSE instead of MSE
  mape:
    _target_: torchmetrics.MeanAbsolutePercentageError

# Learning rate scheduler configuration
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
scheduler_kwargs:
  T_max: 100
  eta_min: 0.00001

