# TNC engine configuration (augmentation-free contrastive learning).

_target_: edamame.engine.TNCEngine

model: ${pretrain.model}
seed: ${seed}

# Optimizer configuration
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
scheduler_kwargs:
  monitor: "val_loss"
  mode: "min"
  factor: 0.5
  patience: 10
  min_lr: 1e-6

# Metrics
metrics: null

# No data augmentation for TNC: the contrastive signal is temporal proximity.
data_augmentation: null
