# Example: Contrastive Learning with WandB
# Run with: python train.py --config-name=example_contrastive

defaults:
  - dataset: eda_default
  - dataloader: default
  - engine: contrastive
  - model: contrastive_mutton
  # - logger: wandb
  # - callbacks: default
  - _self_

# Experiment settings
run_name: contrastive_eda_experiment
seed: 42

# Save configuration
save_final_checkpoint: true

# Trainer configuration
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 400
  accelerator: mps
  devices: auto
  log_every_n_steps: 1
  deterministic: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  precision: "32"
  # fast_dev_run: null
  check_val_every_n_epoch: 1
  profiler: simple

# Override dataloader settings
dataloader:
  batch_size: 256
  shuffle: true
  num_workers: 10
  pin_memory: false
  drop_last: true
  persistent_workers: true

