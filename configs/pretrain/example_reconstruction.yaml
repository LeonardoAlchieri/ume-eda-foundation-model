# Example masked-autoencoder pretraining profile (reconstruction SSL)

defaults:
  - model: mae
  - engine: reconstruction
  - dataset: eda_default
  - dataloader: default
  - logger: wandb
  - callbacks: default
  - _self_

# Experiment settings
# Auto-generated from model, loss, and dataset
segment_length_in_seconds: 60
sampling_rate: 4
segment_length: 240
run_name: "${pretrain.model._target_}__${pretrain.model.loss_fn._target_}__${pretrain.dataset.dataset_names}_${segment_length_in_seconds}s"
seed: 600


# Save configuration
save_final_checkpoint: true

# Trainer configuration
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 400
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  deterministic: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  precision: "32"
  logger: ${pretrain.logger}
  check_val_every_n_epoch: 1
  callbacks: ${pretrain.callbacks}
  # fast_dev_run: 50
  # profiler: simple

# Override dataloader settings
dataloader:
  batch_size: 1024
  shuffle: true
  num_workers: 8
  pin_memory: true
  drop_last: true
  persistent_workers: true

# Override engine optimizer settings
engine:
  optimizer_kwargs:
    lr: 0.001
    weight_decay: 0.001
  scheduler_kwargs:
    T_max: 100
    eta_min: 0.00001

dataset_scaling_fun:
  _target_: ume.utils.dataset_scaling.get_empty_scaling_params
  _partial_: true
