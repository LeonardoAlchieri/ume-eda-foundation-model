# Weights & Biases logger configuration

_target_: pytorch_lightning.loggers.WandbLogger
entity: "usi-mwc-lab"
project: ${project_name}
group: ${group_name}
name: ${run_name}
save_dir: ./wandb_logs.nosync
log_model: "all"  # Enable model checkpoint logging
reinit: finish_previous  # Force reinitialization for each run
id: w9ez7luo  # Let WandB generate unique IDs
resume: "must"  # Never resume runs in sweep mode
# id: null  # Let WandB generate unique IDs
# resume: "allow"  # Never resume runs in sweep mode
# group: ${pretrain.da}
# config: ${pretrain...}

# il group mi identifica che esperimento ho, ovvero i setting univoci, e il name contiene seed e timestamp (del computer)
