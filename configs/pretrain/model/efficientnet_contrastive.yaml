# EfficientNet-based contrastive model configuration

_target_: edamame.model.efficientnet_contrastive.EfficientNetContrastive

# Input specifications
in_channels: 1
seq_len: ${pretrain.dataset.segment_length}

# Architecture parameters
# Default values correspond to the "base" variant in the conf-ume-ablation-size sweep.
stem_channels: 64
mbconv_channels: 64
num_mbconv_blocks: 16  # M parameter - number of MBConv1D blocks. Apple used 16!
head_channels: 248
embedding_dim: 64
kernel_size: 9

# Regularization
dropout: 0.5

# Loss function configuration
loss_fn:
  _target_: edamame.model.loss.contrastive.NCELoss
  temperature: 0.1
  ignore_keys: true
