# Encoder-Decoder model configuration

_target_: ume.model.encoder_decoder.EncoderDecoderModel

encoder_net:
  _target_: ume.model.nn.cnn_encoder.CNNEncoder
  input_dim: 240  # 60 seconds * 4 Hz
  dropout_prob: 0.1
  kernel_size: 7
  stride: 3
  output_dim: 256

decoder_net:
  _target_: ume.model.nn.cnn_encoder.CNNEncoder  # You may want to create a decoder class
  input_dim: 256
  dropout_prob: 0.1
  kernel_size: 7
  stride: 3
  output_dim: 240

bottleneck: null

loss_fn:
  _target_: torch.nn.MSELoss 