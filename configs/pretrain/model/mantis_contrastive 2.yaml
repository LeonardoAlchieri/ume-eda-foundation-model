# Mantis-based contrastive model configuration

_target_: edamame.model.mantis_contrastive.MantisContrastiveModel

model_variant: mantis8m
pretrained_repo_id: "paris-noah/Mantis-8M"
load_pretrained: true
pre_training: true
resize_to_seq_len: 512
device: ${device}

loss_fn:
  _target_: edamame.model.loss.contrastive.NCELoss
  temperature: 0.1
  ignore_keys: false
