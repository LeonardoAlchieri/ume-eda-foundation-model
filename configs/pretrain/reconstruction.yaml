# Example: Reconstruction Learning with TensorBoard
# Run with: python train.py --config-name=example_reconstruction

defaults:
  - model: mae
  - engine: reconstruction
  - dataset: eda_default
  - dataloader: default
  - logger: wandb
  - callbacks: default
  - _self_

model:
  patch_size: 20
  embed_dim: 16
  decoder_embed_dim: 16
  mask_ratio: 0.1
  loss_fn:
    masked_weight: 0.1


# Save configuration
save_final_checkpoint: true


# Trainer configuration
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 400
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  deterministic: false
  # gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  precision: "32"
  logger: ${pretrain.logger}
  check_val_every_n_epoch: 1
  callbacks: ${pretrain.callbacks}
  limit_train_batches: 3000
  # fast_dev_run: 10
  # profiler: simple

# Override dataloader settings
dataloader:
  batch_size: 2048
  num_workers: 8
  pin_memory: true
  drop_last: true
  persistent_workers: true

# Override engine optimizer settings
engine:
  optimizer_kwargs:
    lr: 0.001
    weight_decay: 0.001
  scheduler_kwargs:
    T_max: 100
    eta_min: 0.00001

dataset_scaling_fun:
  _target_: edamame.utils.dataset_scaling.get_empty_scaling_params
  _partial_: true
