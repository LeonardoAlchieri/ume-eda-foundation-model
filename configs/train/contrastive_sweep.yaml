# Example: Reconstruction Learning with TensorBoard
# Run with: python train.py --config-name=example_reconstruction

defaults:
  - model: efficientnet_contrastive
  - engine: contrastive
  - dataset: eda_default
  - dataloader: default
  - logger: csv
  - callbacks: default
  - _self_
  - override /hydra/sweeper: list

# Experiment settings
# Auto-generated from model, loss, and dataset
segment_length_in_seconds: 60
sampling_rate: 4
segment_length: 240
experiment_name: "[EfficientNet Contrastive, User-pair] Explore: lr, batch size and dimensionality"
seed: 600

dataset:
  channels: 1
  sample_scaling_method: null


# Save configuration
save_final_checkpoint: true

# Trainer configuration
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 400
  accelerator: mps
  devices: auto
  # log_every_n_steps: 1
  deterministic: false
  # gradient_clip_val: 1.0
  accumulate_grad_batches: 2 # DEFAULT 1
  precision: "32"
  logger: ${logger}
  check_val_every_n_epoch: 1
  callbacks: ${callbacks}
  fast_dev_run: 2
  # profiler: simple

# Override dataloader settings
dataloader:
  batch_size: 512
  num_workers: 14
  pin_memory: true
  drop_last: true
  persistent_workers: true

# Override engine settings (data augmentation and optimizer)
engine:
  data_augmentation:
    _target_: torchvision.transforms.RandomChoice
    transforms:
      # Gaussian Noise
      - _target_: edamame.data_augmentation.matton_augment.GaussianNoiseStochastic
        sigma_scale_min: 0.0
        sigma_scale_max: 0.5
      # Temporal Cutout
      - _target_: edamame.data_augmentation.matton_augment.TemporalCutoutStochastic
        cutout_size_min: 20
        cutout_size_max: 100
      # Magnitude Warping (Amplitude Warping)
      - _target_: edamame.data_augmentation.matton_augment.AmplitudeWarpingStochastic
        sigma_min: 0.01
        sigma_max: 0.05
        knot_min: 0
        knot_max: 4
      # Time Warping
      - _target_: edamame.data_augmentation.matton_augment.TimeWarpingStochastic
        sigma_min: 0.01
        sigma_max: 0.1
        knot_min: 1
        knot_max: 4
  optimizer_kwargs:
    lr: 0.001
    weight_decay: 0.001
  scheduler_kwargs:
    T_max: 100
    eta_min: 0.00001

dataset_scaling_fun:
  _target_: edamame.utils.dataset_scaling.get_empty_scaling_params
  _partial_: true


hydra:
  mode: MULTIRUN
  sweep:
    dir: "outputs/${experiment_name}/multirun_${now:%Y-%m-%d}-${now:%H-%M-%S}"
    subdir: "${seed}"
  sweeper:
    grid_params: 
      seed: 42
      engine.optimizer_kwargs.lr: 0.0005, 0.007, 0.001, 0.005
    list_params:
      model.mbconv_channels: 8, 64, 128
      model.embedding_dim: 32, 128, 512
# play later with batch size