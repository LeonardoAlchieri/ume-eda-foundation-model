# Example: Reconstruction Learning with TensorBoard
# Run with: python train.py --config-name=example_reconstruction

defaults:
  - model: vae
  - engine: reconstruction
  - dataset: eda_default
  - dataloader: default
  - logger: tensorboard
  - callbacks: default
  - _self_

# Experiment settings
experiment_name: reconstruction_eda_experiment
seed: 600

# Save configuration
save_final_checkpoint: true

# Trainer configuration
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 400
  accelerator: cpu
  devices: auto
  log_every_n_steps: 10
  deterministic: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  precision: "32"
  # fast_dev_run: 50
  check_val_every_n_epoch: 1
  # profiler: simple

# Override dataloader settings
dataloader:
  batch_size: 256
  shuffle: true
  num_workers: 6
  pin_memory: true
  drop_last: true
  persistent_workers: true

# Override engine optimizer settings
engine:
  optimizer_kwargs:
    lr: 0.001
    weight_decay: 0.0001
  scheduler_kwargs:
    T_max: 100
    eta_min: 0.00001
