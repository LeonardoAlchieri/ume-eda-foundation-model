# Example: Reconstruction Learning with TensorBoard
# Run with: python train.py --config-name=example_reconstruction

defaults:
  - model: encoder_decoder
  - engine: reconstruction
  - dataset: eda_default
  - dataloader: default
  - logger: tensorboard
  - callbacks: default
  - _self_

# Experiment settings
experiment_name: reconstruction_eda_experiment
seed: 42

# Save configuration
save_final_checkpoint: true

# Trainer configuration
trainer:
  max_epochs: 100
  accelerator: auto
  devices: auto
  log_every_n_steps: 50
  deterministic: false
  gradient_clip_val: 0.0
  accumulate_grad_batches: 1
  precision: "32"
  fast_dev_run: false
  check_val_every_n_epoch: 1

# Override dataloader settings
dataloader:
  batch_size: 64
  shuffle: true
  num_workers: 4
  pin_memory: true
  drop_last: true

# Override engine optimizer settings
engine:
  optimizer_kwargs:
    lr: 0.001
    weight_decay: 0.0001
  scheduler_kwargs:
    T_max: 100
    eta_min: 0.00001
