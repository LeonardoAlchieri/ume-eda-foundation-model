# Contrastive learning model configuration

_target_: src.model.matton_constrastive.ContrastiveModel

encoder_net:
  _target_: src.model.nn.cnn_encoder.CNNEncoder 
  input_dim: 240  # 60 seconds * 4 Hz
  dropout_prob: 0.1
  kernel_size: 7
  stride: 1
  output_dim: 64

transform_head:
  _target_: src.model.nn.linear_net.LinearNN
  input_dim: 64 # TODO: match encoder_net output_dim
  output_dim: 32

loss_fn:
  _target_: src.model.loss.contrastive.NCELoss
  temperature: 0.1