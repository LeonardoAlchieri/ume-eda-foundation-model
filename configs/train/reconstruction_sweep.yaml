# Example: Reconstruction Learning with TensorBoard
# Run with: python train.py --config-name=example_reconstruction

defaults:
  - model: mae
  - engine: reconstruction
  - dataset: eda_default
  - dataloader: default
  - logger: wandb
  - callbacks: default
  - _self_

# Experiment settings
# Auto-generated from model, loss, and dataset
segment_length_in_seconds: 60
sampling_rate: 4
segment_length: 240
experiment_name: "${model._target_}__${model.loss_fn._target_}__${dataset.dataset_names}_${segment_length_in_seconds}s"
seed: 600

dataset:
  channels: 1
  sample_scaling_method: 
    _target_: edamame.utils.sample_scaling.mean_scaling
    _partial_: true

model:
  mask_ratio: 0.75
  loss_fn:
    masked_weight: 0.9


# Save configuration
save_final_checkpoint: true

# Trainer configuration
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 400
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  deterministic: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  precision: "32"
  logger: ${logger}
  check_val_every_n_epoch: 1
  callbacks: ${callbacks}
  # fast_dev_run: 10
  # profiler: simple

# Override dataloader settings
dataloader:
  batch_size: 1024
  num_workers: 8
  pin_memory: true
  drop_last: true
  persistent_workers: true

# Override engine optimizer settings
engine:
  optimizer_kwargs:
    lr: 0.001
    weight_decay: 0.001
  scheduler_kwargs:
    T_max: 100
    eta_min: 0.00001

dataset_scaling_fun:
  _target_: edamame.utils.dataset_scaling.get_empty_scaling_params
  _partial_: true


hydra:
  mode: RUN
  sweep:
    dir: "outputs/${experiment_name}/multirun_${now:%Y-%m-%d}-${now:%H-%M-%S}"
    subdir: "${model.loss_fn.masked_weight}-${seed}"
  sweeper:
    params: 
      seed: 42
      model.loss_fn.masked_weight: 1.0, 0.9, 0.8, 0.7, 0.6
