name: eda-foundation-models
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Core ML/DL frameworks
  - python
  - pytorch
  - torchvision
  - pytorch-lightning
  - torchmetrics
  
  # Scientific computing
  - numpy
  - scipy
  
  # Configuration and utilities
  - hydra-core
  - omegaconf
  
  # Machine learning utilities
  - scikit-learn
  
  # Signal processing and EDA-specific
  - neurokit2
  
  # Testing
  - pytest
  
  # Standard library (already included in Python, listed for reference)
  # - logging
  # - pathlib
