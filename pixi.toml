[workspace]
channels = ["conda-forge"]
name = "eda-foundation-models"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12"
wandb = ">=0.25.1,<0.26"
hydra-core = ">=1.3.2,<2"
pytorch-lightning = ">=2.6.1,<3"
neurokit2 = ">=0.2.13,<0.3"
notebook = ">=7.5.5,<8"
tensorflow = ">=2.18.0,<3"
pandas = "<3.0"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
tqdm = ">=4.67.3,<5"
packaging = ">=26.0,<27"
imbalanced-learn = ">=0.14.1,<0.15"
pytables = ">=3.11.1,<4"
pytest = ">=9.0.2,<10"
torchvision = ">=0.21.0,<0.27"

[target.osx-arm64.dependencies]
pytorch = ">=2.6.0,<3"

[target.linux-64.dependencies]
pytorch-gpu = ">=2.6.0,<3"

[system-requirements]
cuda = "12"

[pypi-dependencies]
mantis-tsfm = ">=1.0.0, <2"
chronos-forecasting = ">=2.2.2, <3"
edamame_downstream = { path = "../pretrained_foundation_models_physiological_data/.", editable = true }
hydra-list-sweeper = ">=1.1.0, <2"
umap-learn = ">=0.5.11, <0.6"
momentfm = {git = "git+https://github.com/moment-timeseries-foundation-model/moment.git"}
