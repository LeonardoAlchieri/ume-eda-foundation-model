[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edamame"
version = "0.1.0"
description = "Foundation models for electrodermal activity (EDA) signals using self-supervised learning"
readme = "README.md"
authors = [
    {name = "Leonardo Alchieri", email = "leonardo.alchieri@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["deep-learning", "self-supervised-learning", "time-series", "eda", "electrodermal-activity"]

dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=0.11.0",
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0", "hydra-list-sweeper>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
signal = [
    "neurokit2>=0.2.0",
]
notebook = [
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "ipykernel>=6.0.0",
]
all = [
    "edamame[dev,signal,notebook]",
]

[project.urls]
Homepage = "https://github.com/LeonardoAlchieri/eda-foundation-models"
Repository = "https://github.com/LeonardoAlchieri/eda-foundation-models"
Documentation = "https://github.com/LeonardoAlchieri/eda-foundation-models/blob/main/README.md"

[tool.setuptools]
packages = ["edamame"]

[tool.setuptools.package-data]
edamame = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
edamame = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
all = { features = ["all"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
signal = { features = ["signal"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
seaborn = ">=0.13.2,<0.14"
hydra-core = ">=1.3.2,<2"
wandb = ">=0.22.3,<0.23"
neurokit2 = ">=0.2.10,<0.3"
scikit-learn = ">=1.7.2,<2"
numpy = ">=2.3.5,<3"
scipy = ">=1.16.3,<2"
umap-learn = ">=0.5.9.post2,<0.6"
pytables = ">=3.10.2,<4"
torchvision = ">=0.24.0,<0.25"
